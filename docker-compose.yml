version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: eeris_user
      POSTGRES_PASSWORD: eeris_password
      POSTGRES_DB: eeris
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eeris_user -d eeris"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.9.0
    environment:
      NEO4J_AUTH: neo4j/eeris_password
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "eeris_password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  neo4j_data:
